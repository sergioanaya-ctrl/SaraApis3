// 1. EL BLOQUE PLUGINS DEBE IR SIEMPRE EN LA LÍNEA 1
plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '3.4.1'
}

group = 'co.konecta'
version = '1.0-SNAPSHOT'

// 2. COMPATIBILIDAD CON JAVA 8
sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

// 3. REPOSITORIOS GLOBALES
repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url 'https://repo.clojars.org'
        name 'Clojars'
    }
    gradlePluginPortal()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// 4. DEPENDENCIAS
dependencies {
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

    // Serenity (Alineado a 3.4.1)
    implementation 'net.serenity-bdd:serenity-reports:3.4.1'
    implementation 'net.serenity-bdd:serenity-screenplay:3.4.1'
    implementation 'net.serenity-bdd:serenity-screenplay-rest:3.4.1'
    implementation 'net.serenity-bdd:serenity-ensure:3.4.1'

    // Testing Frameworks
    testImplementation 'net.serenity-bdd:serenity-core:3.4.1'
    testImplementation 'net.serenity-bdd:serenity-junit:3.4.1'
    testImplementation 'net.serenity-bdd:serenity-cucumber:3.4.1'
    testImplementation 'io.rest-assured:rest-assured:5.2.0'

    testImplementation 'org.assertj:assertj-core:3.23.1'
    testImplementation 'org.slf4j:slf4j-simple:2.0.3'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'junit:junit:4.13.2'

    // Java Faker & Jackson
    implementation 'com.github.javafaker:javafaker:1.0.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.14.0'
}

// 5. CONFIGURACIÓN DE PRUEBAS
test {
    testLogging.showStandardStreams = true
    maxParallelForks = 3
    systemProperties System.getProperties()
    // Permitir a ByteBuddy definir clases en Java 9+ (Java 21)
    jvmArgs += ['--add-opens=java.base/java.lang=ALL-UNNAMED']
}

serenity {
    reports = ["single-page-html"]
}

gradle.startParameter.continueOnFailure = true

// Al finalizar el test, se ejecuta el 'aggregate' automáticamente
test.finalizedBy(aggregate)